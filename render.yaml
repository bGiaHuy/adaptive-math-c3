services:
  - type: web
    name: adaptive-math-c3-api
    repo: https://github.com/bGiaHuy/adaptive-math-c3
    branch: codex/thpt-production-release
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build:api
    startCommand: npm run start --workspace=@adaptivemath/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_URL
        value: https://adaptive-math-thpt.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: __Host-am_c3_session
      - key: SESSION_TTL_SECONDS
        value: "604800"
      - key: INVITE_CODE_HMAC_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "24"
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: mwapi
      - key: AI_MODEL
        value: claude-haiku-4-5-20251001
      - key: MATH_MWAPI_AUTH_TOKEN
        sync: false
      - key: AI_INPUT_USD_PER_MILLION
        sync: false
      - key: AI_OUTPUT_USD_PER_MILLION
        sync: false
