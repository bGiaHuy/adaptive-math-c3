<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1f1d"/>
      <stop offset="100%" stop-color="#062b25"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle math grid lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#10b981" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#10b981" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Bold Mathematical Radical & Adaptive Curve -->
  <!-- Radical check symbol: tick -> down -> up -> bar -->
  <path d="M12 36 L17 45 L26 18 L52 18" 
        stroke="url(#accentGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Adaptive exponential x inside radical -->
  <path d="M34 30 L44 44 M44 30 L34 44" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round"/>

  <!-- Glowing focal node on top right -->
  <circle cx="52" cy="18" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="52" cy="18" r="2" fill="#ffffff"/>
</svg>
